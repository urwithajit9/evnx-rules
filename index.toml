# The evnx-rules catalogue: what `evnx scan rules add <name>` can fetch.
#
# `path` is relative to this file. evnx refuses a download whose sha256 is
# not the one listed here, so a pack change and its hash change land in the
# same commit; CI checks that they agree.
version = 1

[[pack]]
name        = "gitleaks"
path        = "packs/gitleaks.toml"
sha256      = "b69ef5d82941d44eca89a4250119a8128ded3fa6042422a89542f2e7969cbf7f"
rules       = 221
licence     = "MIT"
upstream    = "https://github.com/gitleaks/gitleaks"
commit      = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
description = "gitleaks' default rule set (v8.30.1), converted to evnx format"

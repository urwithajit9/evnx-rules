# The evnx-rules catalogue: what `evnx scan rules add <name>` can fetch.
#
# `path` is relative to this file. evnx refuses a download whose sha256 is
# not the one listed here, so a pack change and its hash change land in the
# same commit; CI checks that they agree.
version = 1

[[pack]]
name        = "gitleaks"
path        = "packs/gitleaks.toml"
sha256      = "b69ef5d82941d44eca89a4250119a8128ded3fa6042422a89542f2e7969cbf7f"
rules       = 221
licence     = "MIT"
upstream    = "https://github.com/gitleaks/gitleaks"
commit      = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
description = "gitleaks' default rule set (v8.30.1), converted to evnx format"

[[pack]]
name        = "betterleaks"
path        = "packs/betterleaks.toml"
sha256      = "05c06010de8b1b573c9f83388e390a3935e7a80eb9372f5dff526fe1b1103494"
rules       = 426
licence     = "MIT"
upstream    = "https://github.com/betterleaks/betterleaks"
commit      = "44b3e1de15164eab35c41b393a44e2fcf33cabfc"
description = "Betterleaks' default rule set (main 2026-11-07), converted to evnx format; a superset of gitleaks, add one or the other"

[[pack]]
name        = "evnx"
path        = "packs/evnx.toml"
sha256      = "4090e43b34e65ec37991a7d32257562c28251e4945415db1fc4ae1a293f7f6bf"
rules       = 1
licence     = "MIT"
upstream    = "https://github.com/urwithajit9/evnx-rules"
commit      = "n/a (maintained here, not mirrored)"
description = "evnx-specific rules that the mirrored packs miss, such as stateless GitHub App installation tokens; add alongside gitleaks or betterleaks"
